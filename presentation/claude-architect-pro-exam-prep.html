# Six distractor patterns

| Pattern | Sounds like |
|---|---|
| Bigger model | "Switch to a larger model that follows instructions better." |
| Watch, don't remove | "Add logging." "Add a confirmation step." |
| Prompt as policy | "Add to the system prompt that it must never…" |
| Lossy shortcut | "Truncate the document." "Smallest model regardless of fit." |
| Wrong trigger | "The weights changed." "Temperature is too low." |
| Over-engineering | "Split it into five specialized agents." |

**Right answer: the structural fix that matches the trigger and keeps the needed capability.**

???
The first, second, fourth and fifth come straight from wrong options in the three official samples. Prompt-as-policy and over-engineering are the most common wrong answers across architect-level practice material.

When you can name the pattern, you eliminate the option in seconds.

.stem[A team exposes a customer-support agent that can read tickets, draft replies, issue refunds, and delete user accounts. Support staff only ever need to read tickets and draft replies. Applying least-privilege principles, which change best reduces risk?]

.options[
- **A.** Add logging to the refund and delete tools so misuse can be audited later.
- **B.** Remove the refund and delete tools from the agent's configuration entirely.
- **C.** Keep all tools but add a confirmation prompt before refunds and deletions.
- **D.** Replace the agent with a larger model that follows instructions more reliably.
]

class: answer

.q-label[Official sample 1 · Answer]

.correct[B · Remove the refund and delete tools entirely]

| Option | Pattern | Why it fails |
|---|---|---|
| A | Watch, don't remove | Detective control: records damage after it happens |
| C | Watch, don't remove | Compensating control: capability still reachable by injection |
| D | Bigger model | Model size doesn't change authorization scope |

*Remove capability before you guard it.*

???

# Four decisions, in this order

.takeaways[
<ol>
<li><span class="num">1</span><div class="body"><strong>Ownership</strong><span>What Claude does, what existing systems do, what humans do</span></div></li>

<li><span class="num">4</span><div class="body"><strong>Entry point</strong><span>Model, context strategy, surface, delivery route</span></div></li>
</ol>
]

*"Getting these out of order is the most reliable path to an expensive pivot."*

???
From the official prep course 1 overview.

Ownership lens: the four AI properties. Next-token prediction → systems own exact figures. Knowledge → retrieval or live tools own changing facts. Working memory → systems own state. Steerability → code owns control flow and hard rules. Humans own consequential, irreversible decisions.

# Climb the ladder only on evidence

| Rung | What it is | What it costs |
|---|---|---|
| **Augmented LLM** | One call + retrieval, tools, memory | Least flexible |
| **Workflow** | Predefined code paths | Can't adapt to surprises |
| **Agent** | LLM directs its own steps in a loop | Latency, tokens, compounding errors |
| **Multi-agent** | Orchestrator + subagents | **~15× the tokens** of chat |

*If you can draw the flowchart in advance, it's a workflow.*

???
"Building effective agents": find the simplest solution possible; this might mean not building agentic systems at all.

Agents fit when the number of steps is unpredictable and the environment returns ground truth each step (tool results, tests). Always give them stopping conditions and a sandbox.

Multi-agent research system numbers: beat single agent by 90.2% on Anthropic's internal research eval; agents ≈ 4× chat tokens, multi-agent ≈ 15×.

# Five workflows, five cues

| Pattern | Use when | Cue in the stem |
|---|---|---|
| Prompt chaining | Fixed sequential steps with gates | "extract, then validate, then…" |
| Routing | Distinct input categories | "simple vs. complex", "by type" |
| Parallelization | Independent parts, or voting for confidence | "at the same time", "several reviewers" |
| Orchestrator-workers | Subtasks unknown until input is seen | "varies per request", "across sources" |
| Evaluator-optimizer | Clear rubric + iteration helps | "style guide", "refine until" |

???
Guardrails fit sectioning: one instance answers while another screens. Anthropic says that beats one call doing both.

.two-col[
<div>
<div class="col-head green">MULTI-AGENT FITS</div>
<ul>
<li>Breadth-first research</li>
<li>Many independent sources</li>
<li>Information exceeds one context</li>
<li>Task value pays for ~15× tokens</li>
</ul>
</div>
<div>
<div class="col-head">MULTI-AGENT FAILS</div>

<li>All agents need the same context</li>
<li>Real-time coordination</li>
<li>Assuming subagents share memory</li>
</ul>
</div>
]

**Subagents start with only what you pass them.** Give each one its task, constraints, output format, and its own scoped tools.

Decomposition techniques worth naming: pipeline, map-reduce, local + integration pass (big code reviews), specialist, plan-then-execute.

# Model choice is a measured trade-off

| Model (Oct 2026) | Fit | $/MTok in · out |
|---|---|---|
| Fable 5.1 | Hardest reasoning, long-horizon agents | 10 · 50 |
| Opus 5.5 | Agentic coding, knowledge work · "start here" | 4 · 20 |
| Sonnet 5.5 | Speed + intelligence | 2 · 10 |
| Haiku 5.5 | Classification, extraction, routing at volume | 0.10 · 0.50 |

**Decide on your eval set. Tune effort before switching models. Compare cost per completed task.**

???
From the models overview and pricing pages, October 2026. All four: 1M context, 128K output.

Anthropic: "Tuning effort is often a better lever than switching models." Use-case benchmark tests are "the most important step."

Two valid strategies: efficiency-first (start small, upgrade on a measured gap) or capability-first (start large, lower effort or downgrade while evals hold).

Route by difficulty: small model for the easy bulk, larger for the hard tail.

.stem[An application sends the same 8,000-token system prompt and policy document on every request, followed by a short, varying user message. Latency and cost are both concerns. Which optimization most directly addresses both?]

.options[
- **A.** Truncate the policy document to the first 1,000 tokens.
- **B.** Switch to the smallest available model regardless of task fit.
- **C.** Place the static system prompt and policy before the dynamic content and enable prompt caching.
- **D.** Move the policy document into a few-shot example block.
]

| Option | Pattern | Why it fails |

| A | Lossy shortcut | Discards required policy |
| B | Lossy shortcut | "Regardless of task fit" |
| D | Wrong mechanism | Few-shot teaches format; no cacheable prefix |

*Caching matches an exact prefix: tools → system → messages, static → dynamic.*

???
Caching facts: up to 4 breakpoints; 5-min TTL (write 1.25×) or 1-hour (write 2×); reads a fraction of base input; minimum 512 tokens on current models. Cached reads don't count toward ITPM limits on most models. Anthropic: caching is "the largest lever by a wide margin" for agent loops.

Silent cache killers: timestamp or user ID at the top, reordered tools, changing effort between requests.

class: dense

# Prompting and context: the decision table

| Need | Use |
|---|---|
| Exact format or tricky mapping | 3–5 diverse **few-shot** examples + **structured outputs** |
| Multi-step reasoning | Higher **effort** / reasoning before the answer; arithmetic to a tool |
| Guaranteed JSON shape | **Structured outputs** or strict tool use (prefill and forced `tool_choice` error on new models) |
| Long document Q&A | Document first, question last, quotes before answer |
| Long agent sessions | Context editing · compaction · memory tool · a persistent facts block |
| Knowledge base < ~200k tokens | All in context, cached. Skip RAG |
| Many reusable procedures | **Agent Skills** (progressive disclosure, ~100 tokens each until used) |

???
Context-engineering goal from Anthropic: "the smallest possible set of high-signal tokens." A 1M window doesn't make more context better.

System prompts carry role, scope, tone, "say I don't know." Hard limits, authorization and secrets do not belong there.

class: dense

# Tools and identity: find the gap

| Finding | Fix |
|---|---|
| 50+ tools, wrong picks, context burned | Scoped sub-agents · consolidate · **tool search** with `defer_loading` |
| Tools the role never uses | **Remove them** |
| Shared admin service account | Per-user delegated OAuth tokens bound to the session |
| Identity from model text (`user_email` arg) | Identity from SSO; authorize server-side |
| MCP token passthrough | Validate tokens issued for the server; own downstream creds |
| API key in the browser or prompt | Backend proxy; secrets stay server-side |
| JIT provisioning only | SCIM, so IdP removal deprovisions |

???
Every row is a classic distractor-pair: the wrong answer puts the rule in the prompt or adds logging.

Tool search: tools with defer_loading are loaded on demand and don't break the prompt cache.

---

# RAG: design the pipeline

| Stage | Exam answer |
|---|---|
| Before RAG | < ~200k tokens (~500 pages)? Long context + caching |
| Chunking | Structure-aware: headings, whole tables and procedures |
| Contextual retrieval | 50–100 tokens of context per chunk: failures **−35% / −49% / −67%** |
| Index | **Hybrid**: embeddings + BM25 + metadata filters |
| Retrieve | Wide (top-20), then **rerank** |
| Refresh | Re-index with the same embedding model; re-run retrieval evals |

???
Contextual Retrieval numbers: −35% contextual embeddings, −49% adding contextual BM25, −67% adding reranking.

Official Sample 3 (next segment) is a refresh/indexing failure.

---

# Match retrieval to the data

| Data / query | Strategy |
|---|---|
| Docs, conceptual questions | Hybrid embeddings + rerank |
| Part numbers, error codes, IDs | **BM25** + exact-match filters |
| "Q3 sales by region" | **Query tool** (read-only SQL / API) |
| Order status, balance, inventory | **Tool call** to the system of record |
| Permission- or date-scoped | Metadata filters at retrieval |
| Multi-hop | Agentic, iterative search |

*Retrieval over a nightly index is the wrong owner for live state.*

???
Live state vs. retrieval comes from the official prep course objective: "recognize when retrieval is doing a job that live-state should own."

---

# API, MCP, or agent-to-agent?

.grid-3[
.card[
.tag.i-tag[API / CLI]
One consumer. Deterministic call at a known step in code.
.maps[Not when many clients need it]
]
.card[
.tag.c-tag[MCP]
One integration reused by many Claude clients. Tools, resources, prompts. stdio local · Streamable HTTP + OAuth remote.
.maps[Not for one fixed call]
]
.card[
.tag.w-tag[AGENT-TO-AGENT]
Independent agents, often cross-org, each owning tools, state, and policy.
.maps[Not when a tool would do]
]
]

**Progressive discovery** (tool search, Skills, retrieval) beats **monolithic context** for large catalogs with sparse use. Monolithic wins for small, static, always-needed context. Cache it.

???
The API's MCP connector: tool calls only, public remote servers only, not ZDR-eligible.

Delivery routes: direct API (full features, `inference_geo: "us"`), Claude Platform on AWS, Bedrock (GovCloud, FedRAMP High; some features missing), Vertex AI (FedRAMP High), Microsoft Foundry. Procurement and compliance rule routes out first.

# Observability: what dashboards miss

| Signal | Trap |
|---|---|
| `stop_reason: "refusal"` | Arrives as **HTTP 200**. Instrument separately; configure fallback per request |
| 429 rate limit | Honor `retry-after`; ramp traffic gradually |
| 429 from a **spend cap** | No `retry-after`. Retries keep failing. Alert |
| 529 overloaded | Backoff, fallback model or queue |
| Cache hit rate drops | Silent cost spike |

**Trace every step with one request ID:** prompt version, retrieved chunks, tool calls + args, tokens, latency. Redact PII.

???
Reliability patterns from prep course 2: retries, fallbacks, circuit breakers.

Accuracy-latency: caching, fewer reranked chunks, lower effort, faster model on easy routes, parallel tool calls; streaming only helps perceived latency. Justify with eval numbers.

Prep course rule: evals are acceptance criteria built before production code, and the gate before any model or architecture change.

# Evals are the gate

| Grader | Use for | Rule |
|---|---|---|
| **Code-based** | Labels, JSON schema, exact match, tests | Fastest, most reliable. Prefer it |
| **LLM judge** | Faithfulness, tone, rubric scoring | Detailed rubric · reason then score · **validate vs. humans** |
| **Human** | Calibrating the judge, high-stakes spot checks | Gold standard. Avoid at scale |

- **Criteria are measurable:** "≥ 90% score ≥ 4/5, p95 < 5 s, < $0.01", not "good summaries"
- **Volume over hand-graded perfection.** Hold out a set you never tune on
- **pass^k** for customer-facing agents: 75% per run over 3 runs ≈ 42%

???
From "Define success criteria and build evaluations" and "Demystifying evals for AI agents."

Five metric dimensions in the blueprint: accuracy, latency, cost, safety (include false-refusal rate), security (injection success rate).

A/B: hypothesis, one variable, primary + guardrail metrics, sample size up front, report effect size without overclaiming. 2 points on 60 samples is noise.

.stem[A RAG system suddenly returns confident but incorrect answers after a document refresh, while latency and model version are unchanged. What is the most likely first place to investigate?]

.options[
- **A.** The model weights have silently changed.
- **B.** The retrieval/indexing step is returning irrelevant or stale chunks.
- **C.** The temperature setting is too low.
- **D.** The context window has shrunk.

class: answer

.q-label[Official sample 3 · Answer]

.correct[B · Retrieval/indexing returns irrelevant or stale chunks]

| Option | Pattern | Why it fails |
|---|---|---|
| A | Wrong trigger | The stem rules out a model change |
| C | Wrong trigger | Temperature doesn't cause wrong facts after a refresh |
| D | Wrong trigger | Windows don't shrink |

*Diagnose from what changed.*

???
Guide: "a broken re-index or mismatched embeddings."

Diagnosis map: after a refresh → retrieval. Fabricated specifics with good retrieval → hallucination (grounding, "I don't know", citations). After a smaller model, one category fails → model mismatch, route it. After a newer model → prompt tuned to old behavior, re-run evals.

# Optimize cost per completed task

| Lever | Saves | Watch |
|---|---|---|
| Prompt caching | Input cost + time to first token | Static first |
| Message Batches API | **50%** | Async, up to 24 h. Not for users waiting |
| Model routing | Cost + latency | Verify the hard tail on evals |
| Effort | Cost + latency | Raise only where evals show gains |
| Output length | Output tokens cost 5× input | Tight `max_tokens`, structured output |
| Streaming | Perceived latency only | Total time and cost unchanged |

???
Measure cost per successfully completed task, including retries and human rework. A cheap config that fails more costs more.

Batch: up to 100,000 requests or 256 MB per batch; most finish in under an hour; not ZDR-eligible.

???
Prep course 3's question: what stops the system from refusing a valid request, producing an unfair outcome, or taking an action no one approved?

"Assuming Claude enforces a rule it was never given is the most common way a safety design will break."

---

class: dense

# The safety stack fails closed

| Layer | Control | Type |
|---|---|---|
| Input | Injection/jailbreak screen, PII redaction | Model-based + rules |
| System prompt | Scope, "say I don't know" | **Guidance only** |
| Tool calls | Least privilege, per-user authz, parameter limits, approvals | **Deterministic** |
| Output | Schema, PII leak, grounding, policy | Both |
| Audit | Inputs, tool calls, outputs, reviewer decisions | Deterministic |

**Training reduces harm. Your application enforces your rules.** When a control errors, block or route to a human.

???
Model-based checks for fuzzy semantics (probabilistic, need evals). Deterministic checks for exact rules (cheap, auditable).

Indirect injection: untrusted content in tool_result blocks, screen tool outputs, and above all limit what a hijacked agent can do. Anthropic: "no browser agent is immune."

Failure modes: hallucination, injection, excessive agency, over-refusal (measure false-refusal rate), data leakage, sycophancy, cascading agent errors, bias.

---

# Review routing and compliance

.two-col[
<div>
<div class="col-head blue">ROUTE REVIEW BY</div>
<ul>
<li><strong>Confidence</strong>, calibrated on labeled data (not self-reported)</li>
<li><strong>Reversibility</strong> of the action</li>
<li><strong>Cost</strong> of a wrong answer</li>
<li>Automate + sample low risk; approve the irreversible</li>
</ul>
</div>
<div>
<div class="col-head amber">MAP EVERY OBLIGATION</div>
<ul>
<li>Obligation → <strong>control → owner → evidence</strong></li>
<li><strong>GDPR:</strong> minimize, residency/transfer + DPA, human review of legal-effect decisions</li>
<li><strong>HIPAA:</strong> BAA before PHI; check feature eligibility</li>
<li><strong>FedRAMP High:</strong> Bedrock GovCloud or Vertex AI</li>
</ul>
</div>
]

*Fairness is measured by outcomes per group. Deleting a column proves nothing.*

???
Usage Policy high-risk areas: qualified human review + disclosure of AI. A new version effective Nov 12, 2026 expands to 11 areas; "wholly favorable" decisions are exempt.

ZDR traps: not for Batch, Files API, Skills, code execution, MCP connector, Managed Agents. HIPAA readiness is permanent once enabled; Managed Agents and Claude Code not covered.

Transparency has three audiences: users (disclosure + path to a human), regulators (documented controls and evidence), your debugging team (traces).

# Which layer does a setting belong at?

| Scope | Put here |
|---|---|
| **Managed** (no opt-out) | Security policy: deny rules, MCP allowlist, no bypass mode |
| **Project** (committed) | `CLAUDE.md` conventions, `.claude/settings.json`, hooks, `.mcp.json`, skills |
| **Local** (gitignored) | One developer's overrides |
| **User** | Personal preferences |

**CLAUDE.md is guidance. Permissions, hooks, and managed settings are enforcement.**

???
Precedence: managed → CLI → local → project → user. Permissions evaluate deny → ask → allow.

CI: headless `claude -p` with JSON output and a scoped allowlist, usually through the GitHub Action. Humans approve merges; use an independent reviewer.

Rollout: pilot → shared config → champions → wider rollout. Skills distributed via plugins and marketplaces. Spend limits and OTel monitoring in team setup.

Ops: runbooks map symptoms to architectural causes so the team runs without the architect.
