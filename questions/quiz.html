<style>
:root{--cream:#f5f0e6;--paper:#fff;--ink:#1a1a1a;--muted:#6b6559;--line:#ddd5c0;--accent:#b85c1f;--ok:#4d8a3a;--bad:#c0392b;--okbg:#f2f7ef;--badbg:#fbefe4}
@media (prefers-color-scheme:dark){:root{--cream:#1c1c1c;--paper:#262626;--ink:#f5f0e6;--muted:#b8b2a4;--line:#3a3a3a;--okbg:#1f2e1b;--badbg:#3a2418}}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.45 Inter,-apple-system,sans-serif}
header{position:sticky;top:0;background:var(--ink);color:var(--cream);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:2}
header h1{font-size:18px;margin:0;font-weight:800}header .score{margin-left:auto;font-weight:700;color:#e7c548}
header select,header button{font:inherit;padding:4px 8px;border-radius:4px;border:0}
main{max-width:860px;margin:0 auto;padding:16px}
.q{background:var(--paper);border:2px solid var(--ink);padding:16px;margin:16px 0;border-radius:4px}
.meta{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.stem{margin:8px 0 12px}
label{display:block;border:1px solid var(--line);padding:8px 10px;margin:6px 0;border-radius:4px;cursor:pointer}
label.right{background:var(--okbg);border-color:var(--ok)}label.wrong{background:var(--badbg);border-color:var(--bad)}
button.check{background:var(--ink);color:var(--cream);border:0;padding:8px 14px;font-weight:700;border-radius:4px;cursor:pointer}
.exp{display:none;margin-top:12px;border-top:2px solid var(--ok);padding-top:8px;font-size:15px}.exp.show{display:block}
.exp ul{padding-left:18px}.verdict{font-weight:800}
</style></head><body>
<header><h1>CCAR-P Practice Quiz</h1>
<select id="dom" aria-label="Filter by domain"><option value="">All domains</option><option value="D1">D1 · Solution Design &amp; Architecture</option><option value="D2">D2 · Claude Models, Prompting &amp; Context Engineering</option><option value="D3">D3 · Integration</option><option value="D4">D4 · Evaluation, Testing &amp; Optimization</option><option value="D5">D5 · Governance, Safety &amp; Risk Management</option><option value="D6">D6 · Stakeholder Communication &amp; Lifecycle Management</option><option value="D7">D7 · Developer Productivity &amp; Operational Enablement</option></select>
<button id="reset">Reset</button><span class="score" id="score">0 / 0</span></header>
<main id="list"></main>
<script>
const QS = [{"id": 1, "domain": "D1", "objective": "Select appropriate architectural patterns (workflow, agentic, augmented LLM)", "stem": "A logistics company must process 25,000 bills of lading every night. Each document needs the same 14 fields extracted, checked against a carrier master table, and any mismatch sent to a clerk. The team proposes an autonomous agent with tools. Which architecture best fits?", "options": {"A": "An autonomous agent that decides, per document, which extraction and validation steps to run and when to stop.", "B": "A workflow: extraction with structured output, deterministic validation against the master table, mismatches routed to the clerk queue, run through the Message Batches API.", "C": "A multi-agent system with one specialized subagent per field and an orchestrator that merges the 14 results.", "D": "One call to the most capable model with the night's documents concatenated into a single long-context request."}, "answer": ["B"], "why": "The steps are known in advance and identical for every document, so a workflow with predefined code paths fits. Deterministic validation belongs in code, and the Batch API suits non-urgent volume at 50% of the cost.", "wrong": {"A": "Over-engineering. An agent adds latency, tokens, and unpredictability to a fixed sequence.", "C": "Over-engineering. Fourteen subagents multiply tokens and coordination for a single extraction step.", "D": "Lossy shortcut. 25,000 documents will not fit one context, and attention degrades long before the limit."}}, {"id": 2, "domain": "D1", "objective": "Design multi-agent systems and orchestration strategies", "stem": "A research orchestrator spawns six subagents, one per market segment. The user told the orchestrator early on to exclude companies under $10M revenue and to report in a fixed table format. Subagent reports ignore both instructions. What is the most likely cause and fix?", "options": {"A": "The subagents run on a smaller model. Upgrade every subagent to the orchestrator's model.", "B": "The subagents hit their output limit. Raise max_tokens for each subagent call.", "C": "Subagents do not inherit the orchestrator's conversation. Pass the exclusion rule and the output format explicitly in each subagent's task.", "D": "Add a seventh subagent that filters out small companies and reformats the other reports afterward."}, "answer": ["C"], "why": "Each subagent starts with only the context it is given. Constraints the user stated to the orchestrator must be written into every delegated task.", "wrong": {"A": "Bigger model. No model can follow an instruction it never received.", "B": "Wrong trigger. Truncation would cut reports short; it would not drop specific rules.", "D": "Watch, don't remove. A cleanup agent compensates for the missing context at extra cost instead of fixing it."}}, {"id": 3, "domain": "D1", "objective": "Design multi-agent systems and orchestration strategies", "stem": "For which task is an orchestrator-workers multi-agent design LEAST appropriate?", "options": {"A": "Refactoring a module where every change depends on shared type definitions that other changes also edit.", "B": "Surveying the public documentation of 30 independent vendors against the same criteria.", "C": "Due diligence across eight unrelated data rooms, each summarized against a checklist.", "D": "A breadth-first literature search across many sources whose total text exceeds one context window."}, "answer": ["A"], "why": "Tightly coupled work where every worker needs the same evolving context loses more to coordination than it gains from parallelism. A single agent fits better.", "wrong": {"B": "Good fit: independent, parallel, breadth-first work.", "C": "Good fit: independent partitions with a shared checklist.", "D": "Good fit: the information exceeds one context window and splits cleanly."}}, {"id": 4, "domain": "D1", "objective": "Translate business problems into Claude-based AI solutions", "stem": "A wealth-management firm wants advisors to ask: 'What is client X's current allocation, and how does it compare with their stated risk profile?' Which division of work is best?", "options": {"A": "Upload monthly statements to a long chat and let Claude compute current allocations from what it remembers.", "B": "Fine-tune a model on all historical client statements so it knows each client's holdings.", "C": "Load every client's portfolio into the system prompt each morning so Claude always has it.", "D": "The portfolio system computes the current allocation through a tool call. Claude retrieves the risk profile and explains the comparison. The advisor owns any recommendation."}, "answer": ["D"], "why": "Exact, live figures belong to the system of record. Claude owns the language-shaped comparison. Humans own the consequential recommendation.", "wrong": {"A": "Lossy shortcut. Statements go stale, and Claude should not own arithmetic on exact figures.", "B": "Over-engineering. Fine-tuning does not keep live holdings current and is the wrong tool for facts.", "C": "Lossy shortcut. A daily snapshot is stale for live state and wastes context on every client."}}, {"id": 5, "domain": "D1", "objective": "Design end-to-end architectures (input \u2192 processing \u2192 output \u2192 feedback loops)", "stem": "A contract-review assistant launched three months ago. Quality has plateaued, and the team cannot say which failure types are most common. Reviewers fix outputs by hand in the document editor. What is the architecture missing?", "options": {"A": "A model with a larger context window so whole contract families fit in one request.", "B": "A feedback loop that captures reviewer corrections and overrides, labels them, adds them to the eval set, and drives prompt and retrieval changes.", "C": "A second model that re-reviews every output before the human reviewer sees it.", "D": "A longer, more detailed system prompt that lists every clause type the team has seen."}, "answer": ["B"], "why": "Without a loop from output back into evaluation, the team cannot measure failures or improve. Reviewer edits are free labeled data.", "wrong": {"A": "Bigger model. Nothing points to context size as the cause.", "C": "Over-engineering. It adds cost without telling anyone what fails.", "D": "Prompt guesswork without measurement. It may help or hurt, and nobody would know."}}, {"id": 6, "domain": "D1", "objective": "Align solutions to business value pillars (efficiency, transformation, productivity, cost, performance SLAs)", "stem": "A claims director says 'we want AI.' Discovery shows handlers spend 40% of their time summarizing medical records, and 30% of claims miss the 5-business-day decision SLA. Which value framing should anchor the design?", "options": {"A": "Transformation, measured by the number of AI features shipped to the claims team this year.", "B": "Cost, measured by keeping monthly model token spend under a fixed budget.", "C": "Efficiency and performance SLA, measured by handler time per claim and the share of claims decided within 5 days.", "D": "Productivity, measured by the number of prompts each handler runs per day."}, "answer": ["C"], "why": "The pain is handler time and a missed SLA, so the pillars are efficiency and SLA performance, with metrics the director already reports.", "wrong": {"A": "Feature count is an output, not business value.", "B": "Token spend is a cost input. It says nothing about the claims problem.", "D": "Prompt volume measures activity, not outcomes."}}, {"id": 7, "domain": "D1", "objective": "Apply decomposition techniques for complex problem solving", "stem": "A single prompt reviews a 120-file pull request. Feedback on each file is shallow, and cross-file interface bugs are missed. Which decomposition is best?", "options": {"A": "Per-file local analysis passes, then a separate cross-file integration pass focused on interfaces and data flow.", "B": "A model with a larger context window so all 120 files and their history fit in one review call.", "C": "Add 'be thorough and check cross-file issues' to the prompt and run the same review twice.", "D": "Review only the 20 largest files, since most bugs concentrate in big changes."}, "answer": ["A"], "why": "Splitting into focused local passes plus an integration pass avoids diluting attention across 120 files and targets cross-file issues directly.", "wrong": {"B": "Bigger model. More room does not fix attention spread across one giant prompt.", "C": "Prompt emphasis does not change how attention is spent.", "D": "Lossy shortcut. Small files can carry the breaking change."}}, {"id": 8, "domain": "D1", "select": 2, "objective": "Select appropriate architectural patterns (workflow, agentic, augmented LLM)", "stem": "Which TWO signals justify an agent instead of a workflow?", "options": {"A": "The steps are identical for every input.", "B": "The response must arrive in under one second.", "C": "The number and order of steps depend on what is discovered along the way.", "D": "The environment returns ground truth at each step (tool results, test runs) the model can use to course-correct.", "E": "Auditors require a fixed, documented sequence of steps."}, "answer": ["C", "D"], "why": "Agents fit open-ended problems where the path can't be predicted and the environment provides feedback at each step.", "wrong": {"A": "Identical steps describe a workflow.", "B": "Agent loops add latency, so a tight latency budget argues against them.", "E": "A fixed audited sequence is a predefined code path, which is a workflow."}}, {"id": 9, "domain": "D1", "objective": "Select appropriate architectural patterns (workflow, agentic, augmented LLM)", "stem": "Campaign copy must be translated into nine languages to a detailed brand style guide with a scoring rubric. Quality matters more than speed. Which pattern fits best?", "options": {"A": "Routing, sending each language to a different model tier based on how common the language is.", "B": "Evaluator-optimizer, with languages processed in parallel: one call translates, another scores against the rubric and requests revisions.", "C": "An autonomous agent that researches each market and decides how to translate the copy.", "D": "One zero-shot call per language to the most capable model, shipped without review."}, "answer": ["B"], "why": "Clear evaluation criteria plus measurable gains from iteration is the textbook case for evaluator-optimizer. Independent languages parallelize.", "wrong": {"A": "Routing addresses varied input types, not quality refinement against a rubric.", "C": "Over-engineering. The steps are known.", "D": "Bigger model. It skips the rubric check that quality depends on."}}, {"id": 10, "domain": "D1", "objective": "Translate business problems into Claude-based AI solutions", "stem": "Contact-center agents want suggested answers during live calls, built from a product knowledge base and the caller's current order status, within 2 seconds. Which design fits?", "options": {"A": "One augmented-LLM call: retrieval over the knowledge base plus an order-status tool, a fast model, a cached system prompt, and streaming.", "B": "A multi-agent research system that investigates each question across all internal sources before answering.", "C": "A nightly batch job that pre-generates answers to the most likely questions for every open order.", "D": "Retrieval over a nightly export of order data combined with the knowledge base in one index."}, "answer": ["A"], "why": "Augmenting a live interaction calls for the simplest pattern: one call with retrieval and a live tool, tuned for latency.", "wrong": {"B": "Over-engineering. Multi-agent latency and cost break a 2-second budget.", "C": "Pre-generated answers can't reflect the live call or current status.", "D": "Retrieval is doing a job live state should own. Order status changes during the day."}}, {"id": 11, "domain": "D2", "objective": "Select appropriate Claude models based on trade-offs", "stem": "A triage system classifies 2 million tickets a month into 12 categories. The policy floor is 95% accuracy. On the eval set, the current large model scores 96.0%; a smaller model scores 95.6% at one-fifth the cost and three times the speed. What should the architect do?", "options": {"A": "Keep the large model, since it is the most accurate option tested.", "B": "Switch to the smaller model and retire the eval suite to save on evaluation costs.", "C": "Switch to the smaller model, keep the eval suite as a CI gate, and route low-confidence tickets to the large model.", "D": "Keep the large model and enable extended thinking to push accuracy higher."}, "answer": ["C"], "why": "The smaller model clears the policy floor with large cost and latency gains. Evals stay as the gate, and routing handles the hard tail.", "wrong": {"A": "Over-engineering. It pays five times the cost for 0.4 points nobody requires.", "B": "Lossy shortcut. Removing the gate means the next regression ships unseen.", "D": "Over-engineering. It adds cost and latency to an already compliant task."}}, {"id": 12, "domain": "D2", "objective": "Implement prompt reuse strategies (caching, modular prompts, Skills)", "stem": "A legal drafting assistant sends a 40,000-token firm style guide and 30 examples before each user question, several times a minute. Time to first token is 6 seconds. Which change most reduces both latency and cost without losing quality?", "options": {"A": "Move the user question to the start of the prompt so Claude reads it first.", "B": "Keep the style guide and examples as an identical prefix on every request and place a cache breakpoint after them.", "C": "Summarize the style guide down to 2,000 tokens and keep only five examples.", "D": "Route all requests through the Message Batches API to get its 50% discount."}, "answer": ["B"], "why": "A stable prefix plus prompt caching lets repeated content be read from cache, cutting time to first token and input cost while keeping all context.", "wrong": {"A": "Putting dynamic content first breaks the cacheable prefix.", "C": "Lossy shortcut. The guide and examples are what make the drafts right.", "D": "Batch processing is asynchronous. It would make an interactive assistant slower."}}, {"id": 13, "domain": "D2", "objective": "Apply prompt engineering techniques (zero-shot, few-shot, chain-of-thought)", "stem": "An invoice extractor formats dates inconsistently and confuses 'ship date' with 'invoice date' on unusual layouts. Which first change is most effective?", "options": {"A": "Add 'BE EXTREMELY CAREFUL WITH DATES' in capital letters to the instructions.", "B": "Raise the temperature so the model explores alternative readings of each field.", "C": "Switch to the most capable model and keep the prompt unchanged.", "D": "Add three to five diverse examples covering unusual layouts with correct field mapping, and enforce the output format with a JSON schema."}, "answer": ["D"], "why": "Few-shot examples teach the mapping on hard layouts, and a schema fixes the format. Both target the observed failure.", "wrong": {"A": "Emphasis is not information. The model still lacks examples of the confusing layouts.", "B": "Wrong trigger. More randomness increases inconsistency.", "C": "Bigger model. Try the cheap, targeted fix first and let evals decide."}}, {"id": 14, "domain": "D2", "objective": "Apply prompt engineering techniques (zero-shot, few-shot, chain-of-thought)", "stem": "A financial-analysis feature answers multi-step questions. Final answers are often wrong, yet when the model shows its steps the logic is usually right and the arithmetic sometimes slips. What is the best fix?", "options": {"A": "Enable extended thinking or step-by-step reasoning before the final answer, and send calculations to a code or calculator tool.", "B": "Provide few-shot examples that show only final numeric answers for similar questions.", "C": "Lower max_tokens so the model answers concisely without working through steps.", "D": "Ask the model to state its confidence and suppress answers below 80%."}, "answer": ["A"], "why": "Reasoning before answering improves multi-step logic, and exact arithmetic belongs to a deterministic tool.", "wrong": {"B": "Answer-only examples remove the reasoning that helps.", "C": "Lossy shortcut. It suppresses the reasoning the task needs.", "D": "Self-reported confidence is not calibrated, so it is a weak filter."}}, {"id": 15, "domain": "D2", "objective": "Optimize context windows and manage token usage", "stem": "A support agent handles cases that run 200+ turns with many large tool results. Late in a case it forgets constraints the customer stated early, and cost per case keeps rising. What is the best approach?", "options": {"A": "Move to a model with a larger context window and keep the full transcript in every request.", "B": "Delete the oldest half of the conversation whenever usage passes a threshold.", "C": "Keep a structured case-facts block (constraints, decisions, IDs) at the top, clear stale tool results, and compact older turns into a summary.", "D": "Restart the session every 20 turns with no carry-over to keep requests small."}, "answer": ["C"], "why": "Persisting critical facts outside the rolling history and trimming bulky, stale tool output keeps attention on what matters and controls cost.", "wrong": {"A": "Bigger model. A longer window still buries early facts and raises cost.", "B": "Lossy shortcut. It deletes exactly the early constraints that matter.", "D": "Lossy shortcut. Restarting loses the case state."}}, {"id": 16, "domain": "D2", "select": 2, "objective": "Design system prompts, templates, and guardrails", "stem": "A bank is designing the system prompt for a customer chatbot. Which TWO items belong in the system prompt?", "options": {"A": "The rule that refunds over $200 need manager approval, enforced only through this instruction.", "B": "Role, scope, and tone guidance for customer conversations.", "C": "The customer's account number, so Claude can decide what they are authorized to see.", "D": "An instruction to say it does not know when the knowledge base lacks the answer.", "E": "The API key for the core banking system, so tools can authenticate."}, "answer": ["B", "D"], "why": "System prompts carry role, scope, tone, and behavioral guidance such as admitting uncertainty. Hard rules, authorization, and secrets live outside the model.", "wrong": {"A": "Prompt as policy. A refund limit must be enforced in the tool or a pre-tool check.", "C": "Authorization must come from the authenticated session, not from text the model reads.", "E": "Secrets never go into prompts. Tools authenticate server-side."}}, {"id": 17, "domain": "D2", "objective": "Implement prompt reuse strategies (caching, modular prompts, Skills)", "stem": "Thirty teams each have procedural knowledge (brand rules, report templates, analysis scripts) that Claude should use across Claude apps and Claude Code. Loading all of it into every prompt wastes context. What is the best mechanism?", "options": {"A": "Package each team's knowledge as an Agent Skill, so only its name and description load until the skill is needed.", "B": "Concatenate all teams' material into one shared system prompt and cache it.", "C": "Fine-tune a model per team on its templates and scripts.", "D": "Ask users to paste the relevant documents into each conversation."}, "answer": ["A"], "why": "Skills use progressive disclosure: metadata sits in context, and instructions, scripts, and references load only when relevant. They are reusable across surfaces.", "wrong": {"B": "Monolithic context. Caching lowers cost but every request still carries thirty teams' material.", "C": "Over-engineering. Fine-tuning is costly and can't carry executable scripts or templates.", "D": "Manual and inconsistent. It does not scale."}}, {"id": 18, "domain": "D2", "objective": "Optimize context windows and manage token usage", "stem": "A Q&A feature puts the user's question first, followed by a 120,000-token contract. Answers miss details in the middle of the document. What should change first?", "options": {"A": "Switch to the largest model available and keep the prompt layout.", "B": "Split the contract into ten parts, ask the question of each, and concatenate the ten answers.", "C": "Raise the temperature so the model samples more of the document.", "D": "Place the contract first inside XML tags, put the question at the end, and ask Claude to quote the relevant passages before answering."}, "answer": ["D"], "why": "Anthropic's long-context guidance puts long documents at the top and the query at the end, and quote-then-answer focuses attention on the relevant text.", "wrong": {"A": "Bigger model before a free layout fix.", "B": "Lossy shortcut. Answers that span sections get fragmented.", "C": "Wrong trigger. Temperature does not control attention."}}, {"id": 19, "domain": "D3", "objective": "Evaluate tool/agent configuration for capability bloat", "stem": "An internal agent connects to seven MCP servers exposing 52 tools. It picks the wrong tool 18% of the time, and tool definitions use about 30,000 tokens per request. What is the best change?", "options": {"A": "Move to a more capable model that handles large tool catalogs better.", "B": "Add 'choose tools carefully and read every description' to the system prompt.", "C": "Scope each agent's tools to its task (route to sub-agents with small tool sets) and load rarely used tools on demand through tool search.", "D": "Log every wrong tool selection and review the logs weekly with the team."}, "answer": ["C"], "why": "Capability bloat hurts selection accuracy and burns context. Fewer, task-scoped tools plus on-demand discovery fix both.", "wrong": {"A": "Bigger model. The catalog itself is the problem.", "B": "Prompt emphasis does not shrink the catalog or the token cost.", "D": "Watch, don't remove. It measures the problem without fixing it."}}, {"id": 20, "domain": "D3", "objective": "Analyze authentication and authorization requirements to identify security gaps", "stem": "A CRM MCP server authenticates with one service account. The agent passes a user_email argument, taken from what the user typed in chat, to decide whose records to return. What is the core gap and fix?", "options": {"A": "Authorization rests on model-supplied identity. Authenticate users through SSO, call the CRM with a per-user delegated token bound to the session, and authorize server-side.", "B": "Add to the system prompt that the agent must only access records belonging to the current user.", "C": "Encrypt the user_email argument in transit between the agent and the MCP server.", "D": "Log every CRM call with the user_email value for a monthly access review."}, "answer": ["A"], "why": "Identity must come from authentication, not from text the model can be talked into changing. The downstream system enforces access per user.", "wrong": {"B": "Prompt as policy. A prompt injection or a lie in chat bypasses it.", "C": "Transport encryption is irrelevant. The value itself is untrusted.", "D": "Watch, don't remove. The breach still happens."}}, {"id": 21, "domain": "D3", "select": 2, "objective": "Analyze authentication and authorization requirements to identify security gaps", "stem": "Reviewing a remote MCP server design, which TWO findings are security gaps?", "options": {"A": "The server forwards whatever token the client sends straight to the downstream API (token passthrough).", "B": "The server checks that each token was issued for it before using it.", "C": "The server holds read-write admin credentials although it only exposes read-only tools.", "D": "The server uses OAuth with PKCE to authorize users.", "E": "Tool responses include only the fields each task needs."}, "answer": ["A", "C"], "why": "Token passthrough breaks audience validation and enables confused-deputy attacks. Over-privileged credentials violate least privilege.", "wrong": {"B": "Audience validation is a required control.", "D": "OAuth with PKCE is the recommended authorization flow.", "E": "Data minimization is good practice."}}, {"id": 22, "domain": "D3", "objective": "Evaluate accuracy-latency trade-offs and justify configuration decisions", "stem": "A customer chat has a full-response p95 latency of 9 s against a 4 s SLA. Accuracy is 94% against a 90% target. It uses a large model at high effort and sends the top 20 retrieved chunks. Which approach best resolves this?", "options": {"A": "Move the chat to the Message Batches API to cut cost and free capacity.", "B": "Evaluate a faster model or lower effort, and reranked top-5 chunks, on the eval set. Adopt the configuration that meets 4 s with at least 90% accuracy.", "C": "Remove retrieval so the model answers from its own knowledge more quickly.", "D": "Turn on streaming and report the SLA as met based on time to first token."}, "answer": ["B"], "why": "There is accuracy headroom to trade for latency. Candidate configurations are compared on the eval set and the decision is justified with numbers.", "wrong": {"A": "Batch is asynchronous. It makes chat slower.", "C": "Lossy shortcut. Accuracy would collapse below target.", "D": "Streaming improves perceived latency only. The SLA is on the full response."}}, {"id": 23, "domain": "D3", "objective": "Analyze observability challenges and select monitoring strategies at scale", "stem": "A multi-agent system in production gives occasional wrong answers that the team cannot reproduce. Logs capture only the final answer. Which monitoring strategy fits?", "options": {"A": "Keep final-answer logs for two years instead of 30 days so more examples accumulate.", "B": "Upgrade every agent to a more capable model to reduce the error rate.", "C": "Add a feedback button and investigate only conversations users report.", "D": "Distributed tracing with one request ID across orchestrator and subagents, capturing prompt versions, retrieved context, tool calls and results, tokens, and latency, with PII redacted and sampled traces scored by an LLM judge."}, "answer": ["D"], "why": "Agent failures happen in intermediate steps. End-to-end traces make them reproducible and measurable at scale.", "wrong": {"A": "More of the same logs still hide the steps that failed.", "B": "Bigger model without a diagnosis.", "C": "Users report a fraction of failures, and the traces still won't exist."}}, {"id": 24, "domain": "D3", "objective": "Design a RAG pipeline with appropriate chunking and indexing strategies", "stem": "A RAG system over equipment manuals uses fixed 500-token chunks. Tables and multi-step procedures are split mid-step, and answers skip steps. What is the best fix?", "options": {"A": "Raise top-k from 5 to 50 so all pieces of a procedure are likely retrieved.", "B": "Use a larger model that can infer the missing steps from partial chunks.", "C": "Chunk on section and heading boundaries, keep tables and procedures intact, and store the heading path as metadata and chunk context.", "D": "Shrink chunks to 100 tokens so retrieval is more precise."}, "answer": ["C"], "why": "Structure-aware chunking keeps semantic units together, and heading context improves retrieval and grounding.", "wrong": {"A": "Lossy shortcut in reverse: it floods context with noise and cost without restoring order.", "B": "Bigger model. It would guess missing steps, which is hallucination.", "D": "Smaller chunks fragment procedures further."}}, {"id": 25, "domain": "D3", "objective": "Apply retrieval strategies matched to data shape and query pattern", "stem": "Technicians search with part numbers such as 'XR-7741-B' and error codes. Embedding-only retrieval returns similar but wrong parts. Which change fits the query pattern?", "options": {"A": "Add keyword (BM25) retrieval in a hybrid setup with exact-match filters on identifiers, then rerank.", "B": "Switch to a larger embedding model so identifiers are encoded more precisely.", "C": "Increase chunk size so each chunk covers more part numbers.", "D": "Instruct the model to double-check that part numbers match before answering."}, "answer": ["A"], "why": "Exact identifiers are a lexical match problem. Hybrid retrieval with keyword search and filters finds them; embeddings capture meaning, not exact strings.", "wrong": {"B": "Bigger model. Semantic similarity still blurs near-identical codes.", "C": "Larger chunks dilute relevance.", "D": "Prompt as policy. The model can't verify what retrieval never returned."}}, {"id": 26, "domain": "D3", "objective": "Apply retrieval strategies matched to data shape and query pattern", "stem": "Managers ask questions like 'What were Q3 sales by region for product line X?' The data lives in a sales data warehouse. Which retrieval strategy fits?", "options": {"A": "Embed every warehouse row in a vector database and retrieve the top-k most similar rows.", "B": "Give Claude a read-only, parameterized query tool (or validated text-to-SQL) against the warehouse.", "C": "Export the full warehouse into the context window on each request.", "D": "Summarize the warehouse nightly into narrative documents and retrieve those with RAG."}, "answer": ["B"], "why": "Structured, aggregatable data calls for a query engine. Similarity search can't sum or group rows correctly.", "wrong": {"A": "Vector similarity can't compute aggregates.", "C": "Lossy and impossible at warehouse scale.", "D": "Pre-summaries go stale and can't answer arbitrary slices."}}, {"id": 27, "domain": "D3", "objective": "Evaluate connection protocols and select the appropriate integration mechanism (MCP, API/CLI, agent-to-agent)", "stem": "A fixed back-end pipeline calls one internal pricing service at a known step. No other client needs it. The team wants to wrap the service as an MCP server first. What do you recommend?", "options": {"A": "Build the MCP server now so other teams can reuse it later.", "B": "Use an agent-to-agent protocol so the pricing service can negotiate with the pipeline.", "C": "Call the pricing API directly from the pipeline code.", "D": "Package the pricing logic as an Agent Skill that Claude loads when needed."}, "answer": ["C"], "why": "A deterministic call at a known step in code is a plain API integration. MCP pays off when many clients or models need to discover the capability.", "wrong": {"A": "Over-engineering for a speculative future need.", "B": "A2A is for independent agents, not a deterministic service call.", "D": "Moves a deterministic step into model judgment for no benefit."}}, {"id": 28, "domain": "D3", "objective": "Evaluate connection protocols and select the appropriate integration mechanism (MCP, API/CLI, agent-to-agent)", "stem": "A company wants its data platform usable from Claude Desktop, Claude Code, and three custom agents built by different teams. Which integration fits?", "options": {"A": "Each team writes its own tool definitions and API wrapper inside its own app.", "B": "An agent-to-agent protocol between every client and a new data-platform agent.", "C": "Nightly CSV exports that each team uploads to its tool of choice.", "D": "One remote MCP server with OAuth that exposes the platform's tools and resources to every MCP client."}, "answer": ["D"], "why": "MCP standardizes one integration for many clients. Build it once and every MCP-capable host reuses it with consistent auth.", "wrong": {"A": "Duplicated integrations drift and multiply security review.", "B": "Over-engineering. No independent agent needs to negotiate here.", "C": "Stale data and no access control."}}, {"id": 29, "domain": "D3", "objective": "Evaluate connection protocols and select the appropriate integration mechanism (MCP, API/CLI, agent-to-agent)", "stem": "A supplier's inventory agent and a retailer's procurement agent, built by different companies on different stacks, must negotiate stock reservations. Each owns its tools, state, and policies. Which mechanism fits?", "options": {"A": "An agent-to-agent protocol with a defined task contract between the two agents.", "B": "Expose the supplier's inventory database to the retailer's agent through an MCP server.", "C": "Merge both agents into one multi-agent system run by the retailer.", "D": "Exchange emails between the companies and have Claude parse them on each side."}, "answer": ["A"], "why": "Independent agents across organizational boundaries need a peer protocol that keeps each side's tools and policies private.", "wrong": {"B": "Hands another company direct data access and bypasses the supplier's own policies.", "C": "Neither company will hand over its agent, data, and policies.", "D": "Unstructured and unreliable for transactional commitments."}}, {"id": 30, "domain": "D3", "objective": "Evaluate progressive discovery vs. monolithic context strategy", "stem": "An agent can call any of 400 internal API endpoints. Loading every schema costs about 150,000 tokens per request, and most tasks touch three or four endpoints. Which strategy fits?", "options": {"A": "Load all 400 schemas on every request and rely on prompt caching to absorb the cost.", "B": "Progressive discovery: let the agent search or list endpoints and load only the schemas a task needs.", "C": "Permanently cut the catalog to the 20 most-used endpoints.", "D": "Switch to the model with the largest context window so all schemas fit comfortably."}, "answer": ["B"], "why": "A large catalog with sparse use per task favors progressive discovery. Context stays small and selection stays accurate.", "wrong": {"A": "Monolithic context. Caching helps cost, but attention and selection still suffer.", "C": "Lossy shortcut. Real tasks need the long tail.", "D": "Bigger model. It does not fix selection across 400 tools."}}, {"id": 31, "domain": "D4", "objective": "Define evaluation metrics (accuracy, latency, cost, safety, security)", "stem": "Which success criterion for a document-summarization feature is best?", "options": {"A": "Summaries should be good, accurate, and helpful for the business.", "B": "Users should be satisfied with the summaries most of the time.", "C": "At least 90% of summaries score 4 or higher on a faithfulness rubric validated against human graders, zero unsupported claims on a 200-case held-out set, p95 under 5 s, under $0.01 per summary.", "D": "Summaries should use the most capable model available."}, "answer": ["C"], "why": "Criteria must be specific and measurable across accuracy, safety, latency, and cost.", "wrong": {"A": "Not measurable.", "B": "Vague and lagging. It can't gate a release.", "D": "A design choice, not a success criterion."}}, {"id": 32, "domain": "D4", "select": 2, "objective": "Design evaluation datasets and test frameworks using mixed methodologies", "stem": "A system classifies support tickets and drafts replies. Which TWO evaluation practices are sound?", "options": {"A": "Code-based exact-match grading for the category labels.", "B": "The same prompt and model under test grade their own replies as the only judge.", "C": "An LLM judge with a detailed rubric for reply accuracy and tone, validated against a human-graded sample.", "D": "Testing only on 20 hand-picked tickets that the current prompt already handles well.", "E": "Tuning prompts against the full dataset, including the held-out set."}, "answer": ["A", "C"], "why": "Mixed methods: code grading where outputs are checkable, a validated LLM judge where they are nuanced.", "wrong": {"B": "Self-grading shares the system's blind spots.", "D": "Cherry-picked cases hide failures.", "E": "Tuning on the held-out set leaks it and inflates scores."}}, {"id": 33, "domain": "D4", "objective": "Conduct A/B testing and iterative improvements", "stem": "A new prompt variant scores 2.1 points higher on an LLM-judge metric across 60 conversations. Cost and latency are unchanged. The PM wants a global rollout today. What is best?", "options": {"A": "Treat the result as inconclusive, estimate the sample size needed to detect a 2-point effect, run to that size with guardrail metrics, then decide.", "B": "Roll out now; any measured improvement is worth shipping.", "C": "Roll back; a 2-point difference is always noise for LLM outputs.", "D": "Change three more prompt elements in the next test to find a bigger effect faster."}, "answer": ["A"], "why": "Sixty noisy samples can't support the claim. Size the test, watch guardrails, and don't overclaim.", "wrong": {"B": "Overclaims a result that may be noise.", "C": "Overclaims in the other direction. The effect may be real.", "D": "Several simultaneous changes make the result unattributable."}}, {"id": 34, "domain": "D4", "objective": "Diagnose system issues (prompt failure, hallucinations, model mismatch)", "stem": "After moving to a newer model version, a JSON extraction pipeline still returns valid JSON, but string fields now include extra commentary. Prompts and retrieval are unchanged. What is the most likely cause and first fix?", "options": {"A": "The retrieval index went stale. Rebuild it and re-embed the corpus.", "B": "Temperature is too low. Raise it to restore the old behavior.", "C": "The context window shrank. Trim the input documents.", "D": "The prompt was tuned to the old model's behavior. Re-run evals and tighten output constraints for the new model, for example a strict schema with structured outputs."}, "answer": ["D"], "why": "The only change is the model. Newer models follow instructions differently, so re-evaluate and adapt the prompt and output constraints.", "wrong": {"A": "Wrong trigger. Retrieval didn't change.", "B": "Wrong trigger. Temperature doesn't add commentary.", "C": "Wrong trigger. Context windows don't shrink."}}, {"id": 35, "domain": "D4", "objective": "Diagnose system issues (prompt failure, hallucinations, model mismatch)", "stem": "A policy Q&A bot sometimes invents clauses when the knowledge base lacks an answer. For those questions, retrieval returns only low-relevance chunks. What combination works best?", "options": {"A": "Move to a more capable model that knows more policy language.", "B": "Permit 'I don't know' when sources lack the answer, require citations to retrieved passages, and reject answers with claims the retrieved text doesn't support.", "C": "Set temperature to 0 and ship.", "D": "Add few-shot examples of confident, complete answers so the model stops hedging."}, "answer": ["B"], "why": "Grounding plus an explicit way out plus a support check targets fabrication when retrieval comes up empty.", "wrong": {"A": "Bigger model. It invents more fluent clauses.", "C": "Deterministic sampling still fabricates, just consistently.", "D": "Teaches confidence, which worsens fabrication."}}, {"id": 36, "domain": "D4", "objective": "Diagnose system issues (prompt failure, hallucinations, model mismatch)", "stem": "After switching to a smaller model for cost, overall accuracy drops 2 points. All of the drop comes from multi-clause legal questions, 8% of traffic. Other categories are unchanged. What is best?", "options": {"A": "Revert all traffic to the large model.", "B": "Keep the small model for everything and accept the 2-point loss.", "C": "Route the multi-clause category to the larger model and keep the small model for the rest, verified on the eval set.", "D": "Add 'think harder on legal questions' to the prompt for all traffic."}, "answer": ["C"], "why": "This is a model mismatch on one category. Routing keeps most of the savings and restores accuracy where it matters.", "wrong": {"A": "Gives up the savings on the 92% that works.", "B": "Accepts a known, fixable failure.", "D": "Unmeasured prompt tweak instead of a targeted, testable fix."}}, {"id": 37, "domain": "D4", "objective": "Optimize token usage, latency, and cost-performance trade-offs", "stem": "Every night, 50,000 product descriptions are generated with the same 6,000-token instructions. Nothing is user-facing until morning. What is the best cost optimization?", "options": {"A": "Submit the jobs through the Message Batches API and cache the shared instructions.", "B": "Use the real-time API with streaming so each description returns faster.", "C": "Use the most capable model at high effort to avoid regeneration.", "D": "Cut the instructions to 1,000 tokens to reduce input cost."}, "answer": ["A"], "why": "Non-urgent volume suits the Batch API's 50% discount, and caching cuts the repeated instruction cost further.", "wrong": {"B": "Streaming helps perceived latency, which nobody needs overnight.", "C": "Raises cost with no stated quality problem.", "D": "Lossy shortcut. The instructions drive quality."}}, {"id": 38, "domain": "D4", "objective": "Optimize token usage, latency, and cost-performance trade-offs", "stem": "Which metric should guide cost optimization for an agent that resolves support tickets?", "options": {"A": "Cost per input token across all requests.", "B": "Total monthly tokens consumed by the agent.", "C": "Average response length in tokens.", "D": "Cost per successfully resolved ticket, including retries and human rework."}, "answer": ["D"], "why": "The business pays per outcome. A cheaper configuration that fails more can cost more after retries and escalations.", "wrong": {"A": "Per-token price ignores how many tokens and attempts a resolution takes.", "B": "Volume rises with success. It isn't efficiency.", "C": "Length is a proxy that says nothing about resolution."}}, {"id": 39, "domain": "D4", "select": 2, "objective": "Monitor system performance using logging and observability tools", "stem": "Which TWO conditions should trigger alerts for a production Claude system?", "options": {"A": "Any single user complaint about tone.", "B": "A sustained drop in sampled LLM-judge scores against the baseline.", "C": "Any request that uses more than 1,000 tokens.", "D": "Refusal rate or schema-failure rate rising above a set threshold.", "E": "The model name appearing in application logs."}, "answer": ["B", "D"], "why": "Alert on sustained drift in quality and safety signals measured against thresholds.", "wrong": {"A": "A single complaint is noise for paging. Track it as a trend.", "C": "Normal usage. It would page constantly.", "E": "Expected and harmless."}}, {"id": 40, "domain": "D4", "objective": "Optimize token usage, latency, and cost-performance trade-offs", "stem": "Input costs doubled week over week with flat traffic. Usage logs show cache_read_input_tokens fell to near zero right after a deploy that added the current timestamp at the start of the system prompt. What is the fix?", "options": {"A": "Switch to a cheaper model to offset the higher input cost.", "B": "Move the workload to the Message Batches API.", "C": "Move the timestamp after the static content so the cached prefix is identical across requests.", "D": "Raise the organization's rate limits."}, "answer": ["C"], "why": "Caching matches exact prefixes. A changing value at the top invalidates the cache on every request.", "wrong": {"A": "Treats the symptom and may cost quality.", "B": "Asynchronous. Changes the product, not the cause.", "D": "Unrelated to cost."}}, {"id": 41, "domain": "D5", "objective": "Implement guardrails and safety controls", "stem": "A procurement agent approves purchase orders. Policy says orders over $10,000 need a director's approval. The rule is in the system prompt, yet logs show three violations last month. What is the best fix?", "options": {"A": "Restate the rule in capital letters at the top and bottom of the system prompt.", "B": "Enforce the threshold in the approval tool or a pre-tool check: calls over $10,000 are blocked and routed to a director's queue.", "C": "Log every approval over $10,000 for the monthly audit.", "D": "Switch to a more capable model that follows instructions more reliably."}, "answer": ["B"], "why": "A rule that must always hold is enforced deterministically in code, outside the model.", "wrong": {"A": "Prompt as policy, louder.", "C": "Watch, don't remove. It records violations after they happen.", "D": "Bigger model. Still best effort."}}, {"id": 42, "domain": "D5", "objective": "Implement guardrails and safety controls", "stem": "A public chatbot that can create support tickets screens inputs with a moderation classifier. The classifier times out on 1% of requests. What should happen to those requests?", "options": {"A": "Process them normally to protect the user experience.", "B": "Retry the classifier until it responds, however long that takes.", "C": "Ask the main model, in the same call, whether the input is safe and proceed if it says yes.", "D": "Fail closed: respond without tool access, offer a retry or a human, and log the event."}, "answer": ["D"], "why": "When a control fails, the system should fail closed for consequential capabilities and degrade gracefully for the user.", "wrong": {"A": "Fails open. Unscreened input reaches tools.", "B": "Unbounded latency. Users abandon.", "C": "The screened input is grading itself, which defeats the control."}}, {"id": 43, "domain": "D5", "objective": "Identify risks, limitations, and failure modes of LLM systems", "stem": "An agent reads inbound customer emails and has tools to search the CRM and send emails. What is the biggest risk class, and what is the primary mitigation?", "options": {"A": "Indirect prompt injection through email content. Limit capabilities (no arbitrary recipients, no bulk exports), require approval for messages to new recipients, and treat email text as data.", "B": "Hallucination. Set temperature to 0 for every call.", "C": "Latency. Stream responses to users.", "D": "Bias. Remove sender names before processing."}, "answer": ["A"], "why": "Untrusted content plus tools that can send data out is the classic injection-to-exfiltration path. Capability limits hold even when detection misses.", "wrong": {"B": "Real but secondary, and temperature 0 doesn't prevent it.", "C": "Not a safety risk.", "D": "Not the dominant risk for this design."}}, {"id": 44, "domain": "D5", "objective": "Identify risks, limitations, and failure modes of LLM systems", "stem": "A clinical-information assistant refuses 12% of legitimate clinician questions about drug dosing. What should the architect do first?", "options": {"A": "Remove all safety guidance from the system prompt.", "B": "Move to a different model provider.", "C": "Build an eval set of legitimate clinician queries, measure the false-refusal rate, adjust the context (verified clinician audience, scope) and classifier thresholds, and re-measure harmful-output rate.", "D": "Tell clinicians to rephrase questions that get refused."}, "answer": ["C"], "why": "Over-refusal is a failure mode to measure and tune against, while watching the safety metric on the other side.", "wrong": {"A": "Over-correction. It trades one failure for another.", "B": "Unmeasured switch.", "D": "Shifts the burden to users and hides the problem."}}, {"id": 45, "domain": "D5", "objective": "Apply human-in-the-loop validation strategies", "stem": "Which human-in-the-loop routing is best for an insurance claims assistant?", "options": {"A": "An adjuster reviews every claim before any action, regardless of value or confidence.", "B": "Auto-approve low-value claims with high calibrated confidence. Route low-confidence, high-value, or irreversible decisions (denials) to adjusters. Sample auto-approvals for QA.", "C": "Route by the confidence score Claude reports for each claim.", "D": "Process all claims automatically and review those that later get complaints."}, "answer": ["B"], "why": "Route review effort by confidence, reversibility, and cost of a wrong answer, using calibrated thresholds.", "wrong": {"A": "Over-engineering. Reviewer fatigue leads to rubber-stamping.", "C": "Self-reported confidence is not calibrated.", "D": "Watch, don't remove. Errors reach customers first."}}, {"id": 46, "domain": "D5", "objective": "Ensure compliance with regulations (e.g., GDPR, HIPAA, FedRAMP)", "stem": "A US hospital wants Claude to summarize patient records containing PHI. What must be in place before any PHI is sent?", "options": {"A": "A system-prompt instruction telling Claude not to store or repeat PHI.", "B": "Client-side encryption of prompts, with keys held by the hospital.", "C": "Removal of patient names, with all other record content sent as-is.", "D": "A Business Associate Agreement covering the service and the specific features in use, plus minimum-necessary data and access controls."}, "answer": ["D"], "why": "HIPAA requires a BAA with any vendor handling PHI, and coverage depends on the features used.", "wrong": {"A": "Prompt as policy. Not a legal or technical control.", "B": "The model can't process ciphertext.", "C": "Names are one of many identifiers. The rest is still PHI."}}, {"id": 47, "domain": "D5", "select": 2, "objective": "Ensure compliance with regulations (e.g., GDPR, HIPAA, FedRAMP)", "stem": "An EU retailer's support assistant processes customer personal data. Which TWO controls address GDPR obligations?", "options": {"A": "Redact personal data the task does not need before it reaches the model (data minimization).", "B": "Rely on the model's privacy training to avoid retaining personal data.", "C": "Process data in-region or under a valid transfer mechanism, with a data processing agreement with the vendor.", "D": "Add a privacy notice to the system prompt.", "E": "Keep full conversation logs indefinitely for audit purposes."}, "answer": ["A", "C"], "why": "Minimization and lawful processing location with a DPA are architectural controls that map to GDPR obligations.", "wrong": {"B": "Model behavior is not a compliance control.", "D": "The model reading a notice doesn't inform users or limit processing.", "E": "Violates storage limitation."}}, {"id": 48, "domain": "D5", "objective": "Address ethical AI considerations (bias, fairness, transparency)", "stem": "A resume-screening assistant removed name and gender fields, and the team says it is now fair. What is the best next step?", "options": {"A": "Ship it. Protected attributes are no longer visible to the model.", "B": "Add 'evaluate all candidates without bias' to the system prompt.", "C": "Evaluate outcomes on a test set with demographic variation and monitor selection rates by group, since proxies remain. Keep humans making the decision and disclose AI use.", "D": "Use a larger model, which shows less bias."}, "answer": ["C"], "why": "Proxies such as schools, locations, and gaps carry protected information. Fairness is shown by measuring outcomes, not by deleting columns.", "wrong": {"A": "Fairness by deletion is unproven.", "B": "Prompt as policy.", "D": "Bigger model. No measurement."}}, {"id": 49, "domain": "D6", "objective": "Conduct structured discovery and requirement gathering", "stem": "A COO opens the first meeting with 'we want AI for operations.' What is the best opening move for the architect?", "options": {"A": "Ask about current processes, volumes, the metrics the COO reports, the cost of errors, and constraints such as data, compliance, and budget.", "B": "Demo the newest model's capabilities to show what is possible.", "C": "Propose a multi-agent reference architecture to anchor the conversation.", "D": "Ask which vector database and cloud provider the company prefers."}, "answer": ["A"], "why": "Discovery starts from the business problem and its measures, so the design traces back to the business case.", "wrong": {"B": "Solution-first. Requirements are still unknown.", "C": "Architecture before requirements.", "D": "Technology questions before the problem is understood."}}, {"id": 50, "domain": "D6", "objective": "Communicate architectural decisions and trade-offs", "stem": "The CFO must choose between two model configurations for a claims summarizer. How should the architect present the choice?", "options": {"A": "Show public benchmark leaderboard scores for both models.", "B": "Explain the architectural differences between the two models.", "C": "For each option: cost per claim and per month, accuracy on the company's eval set and the risk of errors, latency against the SLA, and what reversing the decision would take, plus a recommendation.", "D": "Recommend the most capable model, since quality always matters most in claims."}, "answer": ["C"], "why": "Executives act on cost, risk, and reversibility in their own terms, with a clear recommendation.", "wrong": {"A": "Generic benchmarks don't reflect this workload.", "B": "Not decision-relevant for a CFO.", "D": "Over-engineering, and no trade-off is shown."}}, {"id": 51, "domain": "D6", "objective": "Manage stakeholder feedback loops and expectation alignment (including SLAs)", "stem": "Which SLA is most appropriate to agree with stakeholders for an AI drafting tool?", "options": {"A": "AI responses will always be correct and complete.", "B": "p95 latency of 5 s or less; at least 92% of drafts accepted with minor edits in monthly sampled review; fallback to a human queue when degraded; a breach triggers review within two business days.", "C": "Accuracy will improve every month after launch.", "D": "No SLA, because LLM outputs are nondeterministic."}, "answer": ["B"], "why": "SLAs for probabilistic systems use measured thresholds with a defined breach response and fallback.", "wrong": {"A": "Promises determinism the system can't deliver.", "C": "Not measurable or enforceable.", "D": "Abdicates expectation alignment."}}, {"id": 52, "domain": "D6", "objective": "Support lifecycle phases (discovery, design, handoff, monitoring, iteration)", "stem": "Two months after launch, accuracy on a newly added product line is 15 points below the others. Other categories are stable. What should the team do?", "options": {"A": "Re-architect to a multi-agent design with one agent per product line.", "B": "Switch to a different model vendor.", "C": "Pause the whole system until the issue is resolved.", "D": "Iterate locally: add the new line's documents and examples to retrieval and the eval set, tune, and verify. Re-architect only if the structure can't support it."}, "answer": ["D"], "why": "A local failure calls for local iteration with evals. Re-architecture is for structural failures.", "wrong": {"A": "Over-engineering for a content gap.", "B": "Unmeasured and unrelated to the gap.", "C": "Over-reaction. Other categories work."}}, {"id": 53, "domain": "D6", "select": 2, "objective": "Document architectures and provide implementation guidance", "stem": "The architect leaves the project in three weeks. Which TWO items must the handoff include so the system survives their absence?", "options": {"A": "Runbooks that map known failure symptoms to first actions and owners.", "B": "The architect's personal API keys so services keep running.", "C": "A slide deck summarizing the original vision.", "D": "The eval suite with thresholds and instructions to run it before any prompt or model change.", "E": "A recorded verbal walkthrough instead of written documentation."}, "answer": ["A", "D"], "why": "The team must diagnose issues and ship changes safely without the architect. Runbooks and the eval gate make that possible.", "wrong": {"B": "Security failure. Credentials belong to service identities, not people.", "C": "Vision without operational detail.", "E": "Not searchable or maintainable."}}, {"id": 54, "domain": "D6", "objective": "Support lifecycle phases (discovery, design, handoff, monitoring, iteration)", "stem": "Anthropic announces the deprecation of the model snapshot your production system uses. What is the best response?", "options": {"A": "Wait until the retirement date, then switch to the newest model alias.", "B": "Treat it as a review trigger: run the eval suite on the successor snapshot, fix regressions, migrate to a pinned snapshot ID before retirement, and inform stakeholders.", "C": "Switch to the successor immediately without testing, since newer models are better.", "D": "Take no action. Deprecated models keep working indefinitely."}, "answer": ["B"], "why": "Deprecations are planned lifecycle events. Evals gate the migration, and pinned snapshots keep behavior stable.", "wrong": {"A": "Last-minute and alias-based, so behavior can change without warning.", "C": "Skips the eval gate.", "D": "Retired models stop serving requests."}}, {"id": 55, "domain": "D6", "objective": "Communicate architectural decisions and trade-offs", "stem": "An enterprise prospect requires every workload to run inside its AWS account, under its existing AWS commitment, with data-residency controls. Its team asks about the direct Claude API. What do you recommend?", "options": {"A": "The direct Claude API, because new features usually arrive there first.", "B": "Wait until all access routes reach full feature parity before choosing.", "C": "Claude through Amazon Bedrock, because the procurement and residency constraints rule out other routes before latency or cost; flag any feature-availability differences.", "D": "Let each team pick its own route so they can compare later."}, "answer": ["C"], "why": "Governance and procurement constraints eliminate options before any other trade-off applies.", "wrong": {"A": "Ignores the hard constraint.", "B": "Stalls the project indefinitely.", "D": "Fragmented governance and duplicated security review."}}, {"id": 56, "domain": "D6", "objective": "Conduct structured discovery and requirement gathering", "stem": "Midway through design, you learn the team assumed every document is in English. About 20% are in Spanish. What is the right practice?", "options": {"A": "Proceed as planned, since the model handles Spanish.", "B": "Quietly add a translation step and mention it at launch.", "C": "Drop Spanish documents from scope to stay on schedule.", "D": "Record assumptions explicitly in the requirements, validate them with stakeholders, add Spanish cases to the eval set, and design for them."}, "answer": ["D"], "why": "Undocumented assumptions become unagreed requirements. Make them explicit, validate them, and test them.", " const list = document.getElementById('list'), scoreEl = document.getElementById('score');
let done = {};
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){
  const dom = document.getElementById('dom').value;
  list.innerHTML = '';
  QS.filter(q => !dom || q.domain === dom).forEach(q => {
    const multi = q.answer.length > 1, type = multi ? 'checkbox' : 'radio';
    const el = document.createElement('section'); el.className = 'q';
    el.innerHTML = `<div class="meta">Q${q.id} · ${q.domain}${multi ? ' · choose ' + q.answer.length : ''}</div>
      <div class="stem">${esc(q.stem)}</div>
      ${Object.entries(q.options).map(([k,v]) => `<label data-k="${k}"><input type="${type}" name="q${q.id}" value="${k}"> <b>${k}.</b> ${esc(v)}</label>`).join('')}
      <button class="check">Check</button>
      <div class="exp"><p class="verdict"></p><p><b>Why ${q.answer.join(', ')}:</b> ${esc(q.why)}</p>
      <ul>${Object.entries(q.wrong).map(([k,v]) => `<li><b>${k}:</b> ${esc(v)}</li>`).join('')}</ul></div>`;
    el.querySelector('.check').onclick = () => {
      const picked = [...el.querySelectorAll('input:checked')].map(i => i.value).sort();
      if (!picked.length) return;
      const ok = picked.join() === [...q.answer].sort().join();
      el.querySelectorAll('label').forEach(l => {
        const k = l.dataset.k;
        l.classList.toggle('right', q.answer.includes(k));
        l.classList.toggle('wrong', picked.includes(k) && !q.answer.includes(k));
      });
      const v = el.querySelector('.verdict'); v.textContent = ok ? 'Correct' : 'Not quite'; v.style.color = ok ? 'var(--ok)' : 'var(--bad)';
      el.querySelector('.exp').classList.add('show');
      done[q.id] = ok; tally();
    };
    list.appendChild(el);
  });
}
function tally(){const v=Object.values(done);scoreEl.textContent=v.filter(Boolean).length+' / '+v.length}
document.getElementById('dom').onchange = render;
document.getElementById('reset').onclick = () => { done = {}; tally(); render(); };
render();
</script></body></html>
